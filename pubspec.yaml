name: bike2go
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Mappe
  flutter_map: ^8.3.2
  latlong2: ^0.9.1

  # Geolocalizzazione
  geolocator: ^14.0.3
  flutter_local_notifications: ^19.4.2

  # HTTP / Google Routes API
  http: ^1.5.0

  # Supabase - sincronizzazione remota
  supabase_flutter: ^2.17.2

  # UI
  cupertino_icons: ^1.0.8

  # Database locale
  sqflite: ^2.4.3
  path: ^1.9.1

  # UUID
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true